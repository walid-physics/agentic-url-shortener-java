name: Java 21 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: agentic-url-shortener-milestone-1/pom.xml

      - name: Compile and test
        working-directory: agentic-url-shortener-milestone-1
        run: mvn --batch-mode --no-transfer-progress clean verify
