spring:
  application:
    name: agentic-url-shortener
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:agentic;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
agentic:
  ai:
    enabled: ${AGENTIC_AI_ENABLED:false}
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    model: ${OPENAI_MODEL:gpt-5.6}
    max-output-tokens: ${OPENAI_MAX_OUTPUT_TOKENS:8000}
    reasoning-effort: ${OPENAI_REASONING_EFFORT:low}
    request-timeout-seconds: ${OPENAI_REQUEST_TIMEOUT_SECONDS:75}
  execution:
    parallelism: ${AGENTIC_PARALLELISM:4}
    task-timeout-seconds: ${AGENTIC_TASK_TIMEOUT_SECONDS:90}
